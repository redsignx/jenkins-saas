[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jenkins-billing"
version = "1.0.0"
description = "Annual billing system for Jenkins SaaS (EC2 fleet + Mac Mini agents)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
]

[project.scripts]
jenkins-billing = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
